<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LicenNode</title>
    <!--
            Roboto and Material Symbols are the M3 reference typeface and icon set.
            They are loaded from Google Fonts with preconnect, and the token file
            falls back to system-ui if the request fails, so text stays readable.
        -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" />
    <style>
        /* md-icon renders a ligature, so the icon font has to be its family. */
        md-icon {
            font-family: "Material Symbols Outlined";
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
